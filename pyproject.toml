[project]
name = "mywbooks"
version = "0.1.0"
description = "The WBooks can manage your collection of web books. Download new chapters, convert to epub and send it to your reading device"
readme = "README.md"
authors = [
    { name = "Nokorot", email = "torhaakon2012@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # "argon2-cffi>=25.1.0",
    "bs4>=0.0.2",
    "cryptography>=43.0",
    "ebooklib>=0.19",
    "fastapi[standard]>=0.115.14",
    "mypy>=1.18.1",
    "pillow>=11.3.0",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0.43",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.1",
    "email-validator>=2.2.0",
    "arq>=0.26.3",
    "httpx>=0.28.1",
    "aiosmtplib>=5.0.0",
    "authx>=1.5.2",
    "argon2-cffi>=25.1.0",
    "requests>=2.33.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "honcho>=2.0.0",
    "isort>=8.0.1",
    "mywbooks",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
mywbooks = { workspace = true }

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mywbooks.patreon"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mywbooks.web_book"]
ignore_errors = true
